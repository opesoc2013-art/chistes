<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chistes API</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .contenedor { max-width: 500px; margin: 0 auto; text-align: center; }
        h1 { font-size: 1.8rem; margin-bottom: 20px; }
        .chiste-box {
            background: white; color: #333; padding: 30px; border-radius: 15px;
            margin: 20px 0; min-height: 150px; display: flex;
            align-items: center; justify-content: center;
            font-size: 1.1rem; line-height: 1.6;
            word-wrap: break-word;
        }
        .error-box {
            background: #ff6b6b; color: white; padding: 20px; border-radius: 10px;
            margin: 20px 0; font-size: 0.9rem; text-align: left;
        }
        .botones { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        button {
            padding: 15px; font-size: 1rem; border: none; border-radius: 10px;
            cursor: pointer; font-weight: 600; transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-chiste { background: #f39c12; color: white; }
        .btn-descargar { background: #27ae60; color: white; display: none; }
        .btn-instalar { background: #e74c3c; color: white; display: none; }
        .credito {
            position: fixed; bottom: 20px; right: 20px;
            background: rgba(0,0,0,0.3); color: white;
            padding: 8px 12px; border-radius: 8px;
            font-size: 0.9rem; font-weight: bold;
        }
        @media (min-width: 500px) { .botones { flex-direction: row; } }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>😂 Chistes Random</h1>
        <div class="chiste-box" id="chisteBox">Presiona el botón para un chiste</div>
        <div id="errorBox"></div>
        <div class="botones">
            <button class="btn-chiste" onclick="traerChiste()">Nuevo Chiste</button>
            <button class="btn-descargar" id="btnDescargar" onclick="descargarChiste()">⬇️ Descargar JSON</button>
            <button class="btn-instalar" id="btnInstalar" onclick="instalarApp()">📱 Instalar en Celular</button>
        </div>
    </div>
    <div class="credito">DFF</div>

    <script>
        const API_KEY = "b5e378bf129b477693ae48e8ddbfab62";
        let chisteActual = null;
        let deferredPrompt = null;

        async function traerChiste() {
            const url = `https://humorapi.com/api/jokes/random?api-key=${API_KEY}`;
            document.getElementById("errorBox").innerHTML = "";
            
            try {
                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                
                console.log("Respuesta completa:", datos);
                
                if (!respuesta.ok) {
                    document.getElementById("errorBox").innerHTML = 
                        `<div class="error-box">
                            <b>Error ${respuesta.status}:</b><br>
                            ${JSON.stringify(datos, null, 2)}
                        </div>`;
                    return;
                }
                
                chisteActual = datos;
                document.getElementById("chisteBox").textContent = datos.joke;
                document.getElementById("btnDescargar").style.display = "block";
            } catch (error) {
                document.getElementById("errorBox").innerHTML = 
                    `<div class="error-box">
                        <b>Error de conexión:</b><br>
                        ${error.message}
                    </div>`;
            }
        }

        function descargarChiste() {
            const blob = new Blob([JSON.stringify(chisteActual, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chiste.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById("btnInstalar").style.display = "block";
        });

        function instalarApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(() => {
                    deferredPrompt = null;
                    document.getElementById("btnInstalar").style.display = "none";
                });
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
