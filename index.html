<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chistes API</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .contenedor {
            max-width: 500px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }
        .chiste-box {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .botones {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            padding: 15px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-chiste { background: #f39c12; color: white; }
        .btn-descargar { background: #27ae60; color: white; display: none; }
        
        .credito {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        @media (min-width: 500px) {
            .botones { flex-direction: row; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1>😂 Chistes Random</h1>
        <div class="chiste-box" id="chisteBox">Presiona el botón para un chiste</div>
        <div class="botones">
            <button class="btn-chiste" onclick="traerChiste()">Nuevo Chiste</button>
            <button class="btn-descargar" id="btnDescargar" onclick="descargarChiste()">⬇️ Descargar</button>
        </div>
    </div>
    
    <div class="credito">DFF</div>

    <script>
        const API_KEY = "TU_CLAVE_AQUI";
        let chisteActual = null;
        
        async function traerChiste() {
            const url = `https://humorapi.com/api/jokes/random?api-key=${API_KEY}`;
            try {
                const respuesta = await fetch(url);
                chisteActual = await respuesta.json();
                document.getElementById("chisteBox").textContent = chisteActual.joke;
                document.getElementById("btnDescargar").style.display = "block";
            } catch (error) {
                document.getElementById("chisteBox").textContent = "Error: Verifica tu API Key";
            }
        }
        
        function descargarChiste() {
            const blob = new Blob([JSON.stringify(chisteActual, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'chiste.json';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
